name: Problema no app
description: Algo não funciona como deveria (tela, voz, atividade, modo offline).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar! **Não inclua nomes, fotos, progresso exportado nem palavras de pessoas reais.**
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o que você viu e o que esperava ver.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      description: Passo a passo (por exemplo, "etapa 8, terceira atividade, toquei em BE").
    validations:
      required: true
  - type: input
    id: aparelho
    attributes:
      label: Aparelho, Android e navegador
      placeholder: "Ex.: Android 15, Chrome 140"
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app
      description: "Área da mediadora (⚙) → Aparelho e conta → Versão do app."
      placeholder: "ler-livre-v11"
  - type: dropdown
    id: voz
    attributes:
      label: A voz funciona neste aparelho?
      options: ["Sim", "Não, fica mudo", "Fala, mas pronuncia errado"]
