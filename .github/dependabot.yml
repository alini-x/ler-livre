# Mantém as ações do GitHub (fixadas por hash) e a dependência dos testes e2e atualizadas, com correções de segurança.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "pip"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
