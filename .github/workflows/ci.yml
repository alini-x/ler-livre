# Roda os testes em todo pull request e em pushes que não sejam na main (a main roda no fluxo de publicação).
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Testes (conteúdo, segurança e consistência)
        run: python3 -m unittest discover -s tests -v
      - name: Teste de ponta a ponta (Chrome sem interface)
        run: |
          pip install --no-cache-dir -r tests/e2e/requirements.txt
          python3 tests/e2e/run.py
