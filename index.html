<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ler Livre</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header id="topo">
    <button id="btn-ouvir" class="btn-ouvir" aria-label="Ouvir de novo">
      <span class="ico">🔊</span><span class="rotulo">OUVIR</span>
    </button>
    <div class="topo-direita">
      <button id="btn-inicio" class="btn-inicio" aria-label="Voltar ao início" hidden>🏠</button>
      <button id="btn-mediadora" class="btn-discreto" aria-label="Área de quem ajuda">⚙</button>
    </div>
  </header>
  <div id="progresso" aria-hidden="true"></div>
  <div id="aviso-voz" hidden>🔇 SEM VOZ EM PORTUGUÊS NESTE NAVEGADOR. PEÇA AJUDA (⚙ → TESTAR A VOZ).</div>
  <main id="tela"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
